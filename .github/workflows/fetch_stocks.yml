name: Fetch Selected Japan Stocks

on:
  schedule:
    # ───────── JST (UTC+9) ──────────
    # 9:00〜11:30 → UTC 0:00〜2:30
    - cron: "0,30 0-2 * * 1-5"
    # 12:30〜15:30 → UTC 3:30〜6:30
    - cron: "30 3-6 * * 1-5"
  workflow_dispatch:

jobs:
  fetch_prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas

      - name: Run stock price fetch
        run: python fetch_selected_stocks.py

      - name: Commit and push generated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data/*.csv
          git commit -m "Add stock data CSV from GitHub Actions" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
