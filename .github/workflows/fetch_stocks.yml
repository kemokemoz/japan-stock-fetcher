name: Fetch Selected Japan Stocks

on:
  schedule:
    - cron: "0 0 * * 1-5"    # JST 09:00
    - cron: "30 0 * * 1-5"   # JST 09:30
    - cron: "0 1 * * 1-5"    # JST 10:00
    - cron: "30 1 * * 1-5"   # JST 10:30
    - cron: "0 2 * * 1-5"    # JST 11:00
    - cron: "30 2 * * 1-5"   # JST 11:30
    - cron: "30 3 * * 1-5"   # JST 12:30
    - cron: "0 4 * * 1-5"    # JST 13:00
    - cron: "30 4 * * 1-5"   # JST 13:30
    - cron: "0 5 * * 1-5"    # JST 14:00
    - cron: "30 5 * * 1-5"   # JST 14:30
    - cron: "0 6 * * 1-5"    # JST 15:00
    - cron: "30 6 * * 1-5"   # JST 15:30

  workflow_dispatch:

jobs:
  fetch_prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PUSH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas jpholiday

      - name: Fetch stock prices
        run: python fetch_selected_stocks.py

      - name: Commit & Push CSV
        env:
          PAT_TOKEN: ${{ secrets.REPO_PUSH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data/*.csv
          git commit -m "Add stock data" || echo "No changes"
          git push https://${PAT_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
