name: Fetch Japan Stock Prices

on:
  # 平日 9:00～16:00 JST の間で 1時間ごとに実行
  schedule:
    - cron: '0 0-7 * * 1-5'  # UTC 0-7 → JST 9-16, 月～金
  workflow_dispatch:         # 手動実行も可能

jobs:
  fetch_prices:
    runs-on: ubuntu-latest

    steps:
      # リポジトリをクローン
      - name: Checkout repository
        uses: actions/checkout@v3

      # Python 環境をセットアップ
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 必要パッケージをインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas xlrd requests

      # 株価取得スクリプトを実行
      - name: Run stock price fetch
        run: python fetch_all_japan_stocks.py
