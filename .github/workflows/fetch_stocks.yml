name: Fetch Selected Japan Stocks

on:
  schedule:
    - cron: "*/5 * * * 1-5"    # 平日5分ごと（UTC）
  workflow_dispatch:

jobs:
  fetch_prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PUSH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas jpholiday

      - name: Check Japan Holiday / Year-end Holidays
        run: |
          python3 << 'EOF'
          import datetime, jpholiday
          now = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
          today = now.date()

          # 年末年始
          if (today.month == 12 and today.day >= 29) or (today.month == 1 and today.day <= 3):
              print("⛔ 年末年始のため停止")
              exit(1)

          # 日本の祝日
          if jpholiday.is_holiday(today):
              print("⛔ 日本の祝日のため停止")
              exit(1)

          print("✅ 稼働OK")
          EOF

      - name: Fetch stock prices
        run: python fetch_selected_stocks.py

      - name: Commit & Push CSV
        env:
          PAT_TOKEN: ${{ secrets.REPO_PUSH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add stock_data/*.csv
          git commit -m "Add stock data" || echo "No changes"
          git push https://${PAT_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
