name: Fetch Selected Japan Stocks

on:
  schedule:
    # JST 9:00〜11:30（UTC 0:00〜2:30）
    - cron: "0,30 0-2 * * 1-5"
    # JST 12:30〜15:30（UTC 3:30〜6:30）
    - cron: "30 3-6 * * 1-5"
  workflow_dispatch:

jobs:
  fetch_prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with PAT
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.REPO_PUSH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas jpholiday

      - name: Check Japan Holiday / Year-end Holidays
        run: |
          python3 << 'EOF'
          import datetime, jpholiday

          # JST 現在日時
          now = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
          today = now.date()

          # 年末年始の判定（12/29〜1/3）
          if (today.month == 12 and today.day >= 29) or (today.month == 1 and today.day <= 3):
              print("⛔ 年末年始のため処理を停止します。", today)
              exit(1)

          # 日本の祝日判定
          if jpholiday.is_holiday(today):
              print("⛔ 日本の祝日のため停止します:", today)
              exit(1)

          print("✅ 祝日ではありません。処理を継続します:", today)
          EOF

      - name: Run stock price fetch
        run: python fetch_selected_stocks.py

      - name: Commit and push generated CSV using PAT
        env:
          PAT_TOKEN: ${{ secrets.REPO_PUSH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data/*.csv
          git commit -m "Add stock data CSV from GitHub Actions" || echo "No changes to commit"
          git push https://${PAT_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
