name: Fetch Japan Stock Prices

on:
  schedule:
    - cron: '0 0-7 * * 1-5'  # UTC 0-7 → JST 9-16, 月～金
  workflow_dispatch:         # 手動実行も可能

jobs:
  fetch_prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas xlrd requests

      - name: Run stock price fetch
        run: python fetch_all_japan_stocks.py
