name: Fetch Selected Japan Stocks

on:
  schedule:
    # --- デバッグ用の一時的な設定 ---
    # 平日（月〜金）の毎時0分と30分に実行します（UTC）
    # JSTでは、9:00, 9:30, 10:00, 10:30, ... と30分ごとに動きます
    - cron: "0,30 * * * 1-5" 
    # -------------------------------

  workflow_dispatch:

jobs:
  fetch_prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with PAT
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PUSH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yfinance pandas jpholiday

      - name: Fetch stock prices
        run: python fetch_selected_stocks.py

      - name: Commit & Push CSV
        env:
          PAT_TOKEN: ${{ secrets.REPO_PUSH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock_data/*.csv
          git commit -m "Add stock data" || echo "No changes"
          git push https://${PAT_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
